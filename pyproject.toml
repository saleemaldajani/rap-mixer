[project]
name = "rap-mixer"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["gradio>=5.20,<7", "numpy>=1.26", "pandas>=2.1", "pydantic>=2.7", "plotly>=5.20", "librosa>=0.10", "soundfile>=0.12", "PyYAML>=6", "python-dotenv>=1", "openai>=1.100", "google-genai>=1.50", "sounddevice>=0.5", "mido>=1.3", "python-rtmidi>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
whisper = ["faster-whisper>=1.0", "transformers>=4.40", "torch>=2.2"]
cloud = ["openai>=1.30", "anthropic>=0.28", "google-genai>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["rap_mixer*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "F401", "F841"]
